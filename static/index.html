<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC User Auth & Video Calling Client</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #eab308;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 600;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .auth-tab {
      background: transparent;
      color: var(--text-muted);
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    input {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    button:hover { background: var(--accent-hover); color: #fff; }
    button.btn-danger { background: var(--danger); color: #fff; }
    button.btn-danger:hover { background: #dc2626; }
    button.btn-secondary { background: var(--border); color: var(--text-main); }
    button.btn-secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .user-card {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 600; font-size: 0.9rem; }
    .user-username { font-size: 0.75rem; color: var(--text-muted); }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      margin-right: 6px;
    }

    .status-dot.online { background: var(--success); }

    .call-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .video-card {
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    .video-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #fff;
    }

    .logs-console {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #38bdf8;
      height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Incoming Call Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card h3 { font-size: 1.2rem; margin-bottom: 10px; color: var(--accent); }
    .modal-card p { font-size: 0.95rem; margin-bottom: 20px; color: var(--text-main); }
    .modal-actions { display: flex; gap: 15px; justify-content: center; }
  </style>
</head>
<body>

  <header>
    <h1>📹 WebRTC Direct Call Client</h1>
    <div id="userProfileBadge" class="user-badge">Not Logged In</div>
  </header>

  <div class="main-grid">

    <!-- Auth & User Directory Sidebar -->
    <div style="display: flex; flex-direction: column; gap: 20px;">

      <!-- Authentication Box -->
      <div class="panel" id="authPanel">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</button>
          <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</button>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="form-group" id="displayNameGroup" style="display: none;">
            <label for="displayName">Display Name</label>
            <input type="text" id="displayName" placeholder="e.g. Alice Smith">
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="e.g. alice">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>

          <button type="submit" id="btnAuthSubmit" style="width: 100%; margin-top: 5px;">Login Account</button>
        </form>
      </div>

      <!-- User Directory Box -->
      <div class="panel">
        <div class="panel-title">
          <span>👥 Registered Users</span>
          <button onclick="fetchUsers()" class="btn-secondary" style="padding: 3px 8px; font-size: 0.75rem;">Refresh</button>
        </div>
        <div id="userList" class="user-list">
          <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 15px;">Login to view users</div>
        </div>
      </div>

    </div>

    <!-- WebRTC Call & Video Stream Area -->
    <div class="call-area">

      <div class="panel" style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 10px; align-items: center;">
          <button id="btnStartMedia" onclick="startLocalMedia()">🎥 Enable Camera & Mic</button>
          <button id="btnMuteAudio" onclick="toggleAudio()" disabled style="background: #eab308; color: #000;">🎙️ Mute Mic</button>
          <button id="btnToggleVideo" onclick="toggleVideo()" disabled style="background: #a855f7; color: #fff;">📹 Toggle Video</button>
        </div>
        <button id="btnEndCall" onclick="endCall()" class="btn-danger" disabled>❌ End Call</button>
      </div>

      <div class="video-grid">
        <div class="video-card">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-label">Local Camera (You)</div>
        </div>
        <div class="video-card">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-label" id="remoteLabel">Remote User (Waiting for call...)</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <span>Signaling & Call Event Console</span>
          <button onclick="clearLogs()" class="btn-secondary" style="padding: 2px 6px; font-size: 0.7rem;">Clear</button>
        </div>
        <div id="logConsole" class="logs-console"></div>
      </div>

    </div>

  </div>

  <!-- Incoming Call Modal -->
  <div id="incomingCallModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>📞 Incoming Call!</h3>
      <p id="incomingCallText">User is calling you...</p>
      <div class="modal-actions">
        <button onclick="acceptCall()" style="background: var(--success); color: #fff; padding: 10px 20px;">✅ Accept</button>
        <button onclick="declineCall()" class="btn-danger" style="padding: 10px 20px;">❌ Decline</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let accessToken = null;
    let authMode = 'login';
    let ws = null;

    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let activeCallRoomId = null;
    let pendingCallData = null;
    let currentTargetUserId = null;
    let iceCandidatesBuffer = [];

    let rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' },
        { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' }
      ],
      iceCandidatePoolSize: 10
    };

    async function loadTurnCredentials() {
      try {
        const res = await fetch('/api/turn-credentials');
        if (res.ok) {
          const config = await res.json();
          if (config && config.iceServers) {
            rtcConfig = config;
            log('Fetched dynamic TURN credentials from backend API', 'success');
          }
        }
      } catch (e) {
        log('Using default TURN configuration', 'info');
      }
    }

    function log(msg, type = 'info') {
      const consoleEl = document.getElementById('logConsole');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = `log-item ${type}`;
      div.textContent = `[${time}] ${msg}`;
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('logConsole').innerHTML = '';
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('displayNameGroup').style.display = mode === 'register' ? 'flex' : 'none';
      document.getElementById('btnAuthSubmit').textContent = mode === 'login' ? 'Login Account' : 'Register Account';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const displayName = document.getElementById('displayName').value.trim();

      const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
      const body = authMode === 'login' 
        ? { username, password }
        : { username, password, display_name: displayName };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.detail || 'Authentication failed');
          return;
        }

        currentUser = data.user;
        accessToken = data.access_token;
        document.getElementById('userProfileBadge').textContent = `👤 ${currentUser.display_name} (@${currentUser.username})`;
        log(`Logged in as '${currentUser.display_name}'. JWT Token acquired!`, 'success');

        await loadTurnCredentials();
        connectUserWebSocket();
        fetchUsers();
        setInterval(fetchUsers, 5000);

      } catch (err) {
        alert('Server connection error: ' + err.message);
      }
    }

    function connectUserWebSocket() {
      if (!currentUser) return;

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/user/${currentUser.id}`;

      log(`Connecting User WebSocket: ${wsUrl}...`);
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log('User WebSocket connected! Online status active.', 'success');
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        log(`WebSocket Event: ${msg.type}`, 'info');
        await handleUserSignalingMessage(msg);
      };

      ws.onclose = () => {
        log('User WebSocket closed.', 'warn');
      };
    }

    async function fetchUsers() {
      if (!accessToken) return;

      try {
        const res = await fetch('/api/users', {
          headers: {
            'Authorization': `Bearer ${accessToken}`
          }
        });
        const data = await res.json();
        const listEl = document.getElementById('userList');
        listEl.innerHTML = '';

        if (!res.ok) {
          listEl.innerHTML = `<div style="color: var(--danger); font-size: 0.85rem; text-align: center; padding: 10px;">${data.detail || 'Unauthorized'}</div>`;
          return;
        }

        if (!data.users || data.users.length === 0) {
          listEl.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">No registered users found.</div>';
          return;
        }

        data.users.forEach(u => {
          if (currentUser && u.id === currentUser.id) return;

          const card = document.createElement('div');
          card.className = 'user-card';

          const statusClass = u.is_online ? 'online' : '';
          const statusText = u.is_online ? 'Online' : 'Offline';

          card.innerHTML = `
            <div class="user-info">
              <div class="user-name">
                <span class="status-dot ${statusClass}"></span>${u.display_name}
              </div>
              <div class="user-username">@${u.username} • ${statusText}</div>
            </div>
            ${u.is_online ? `<button onclick="initiateCall('${u.id}', '${u.display_name}')" style="padding: 5px 10px; font-size: 0.8rem;">📞 Call</button>` : ''}
          `;
          listEl.appendChild(card);
        });
      } catch (e) {
        console.error('Failed to fetch users:', e);
      }
    }

    async function startLocalMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        log('Local camera and microphone enabled', 'success');
      } catch (err) {
        log('Generating synthetic test video/audio stream...', 'warn');
        localStream = createSyntheticStream();
        document.getElementById('localVideo').srcObject = localStream;
        log('Synthetic test video stream enabled!', 'success');
      }
      document.getElementById('btnStartMedia').disabled = true;
      document.getElementById('btnMuteAudio').disabled = false;
      document.getElementById('btnToggleVideo').disabled = false;
    }

    function createSyntheticStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 640; canvas.height = 480;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        angle += 0.05;
        ctx.beginPath();
        ctx.arc(canvas.width/2 + Math.cos(angle)*150, canvas.height/2 + Math.sin(angle)*80, 35, 0, Math.PI*2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 22px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(currentUser ? currentUser.display_name : 'Test Stream', canvas.width/2, 80);
        requestAnimationFrame(draw);
      }
      draw();
      return canvas.captureStream(30);
    }

    function initiateCall(targetUserId, targetName) {
      if (!localStream) {
        alert('Please click "Enable Camera & Mic" first before placing a call.');
        return;
      }

      currentTargetUserId = targetUserId;
      log(`Calling ${targetName} (${targetUserId})...`);

      ws.send(JSON.stringify({
        type: 'call_user',
        targetUserId: targetUserId,
        callerName: currentUser.display_name,
        isVideo: true
      }));

      document.getElementById('remoteLabel').textContent = `Calling ${targetName}...`;
    }

    async function handleUserSignalingMessage(msg) {
      switch (msg.type) {
        case 'incoming_call':
          pendingCallData = msg;
          document.getElementById('incomingCallText').textContent = `${msg.callerName} is calling you!`;
          document.getElementById('incomingCallModal').style.display = 'flex';
          log(`Incoming call from ${msg.callerName}`, 'warn');
          break;

        case 'call_accepted':
          log(`Call accepted by remote user!`, 'success');
          activeCallRoomId = msg.roomId;
          document.getElementById('btnEndCall').disabled = false;
          await createPeerConnection(currentTargetUserId);
          await createAndSendOffer(currentTargetUserId);
          break;

        case 'call_declined':
          log(`Call was declined by remote user.`, 'error');
          alert('Call declined.');
          resetCallUI();
          break;

        case 'end_call':
          log(`Remote user ended the call.`, 'warn');
          resetCallUI();
          break;

        case 'offer':
          log(`Received SDP Offer from ${msg.senderId}`);
          await createPeerConnection(msg.senderId);
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          await drainIceBuffer();

          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          ws.send(JSON.stringify({
            type: 'answer',
            targetUserId: msg.senderId,
            sdp: answer
          }));
          log(`Sent SDP Answer to ${msg.senderId}`, 'success');
          break;

        case 'answer':
          log(`Received SDP Answer from ${msg.senderId}`);
          if (peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.sdp));
            await drainIceBuffer();
          }
          break;

        case 'ice_candidate':
          if (msg.candidate) {
            const cand = new RTCIceCandidate(msg.candidate);
            if (peerConnection && peerConnection.remoteDescription) {
              await peerConnection.addIceCandidate(cand);
            } else {
              iceCandidatesBuffer.push(cand);
            }
          }
          break;
      }
    }

    async function drainIceBuffer() {
      if (peerConnection && peerConnection.remoteDescription) {
        for (const cand of iceCandidatesBuffer) {
          await peerConnection.addIceCandidate(cand);
        }
        iceCandidatesBuffer = [];
      }
    }

    async function acceptCall() {
      document.getElementById('incomingCallModal').style.display = 'none';
      if (!pendingCallData) return;

      if (!localStream) {
        await startLocalMedia();
      }

      currentTargetUserId = pendingCallData.callerId;
      activeCallRoomId = pendingCallData.roomId;

      ws.send(JSON.stringify({
        type: 'accept_call',
        callerId: pendingCallData.callerId,
        roomId: pendingCallData.roomId
      }));

      document.getElementById('btnEndCall').disabled = false;
      document.getElementById('remoteLabel').textContent = `Connected with ${pendingCallData.callerName}`;
      log(`Call accepted. Connecting WebRTC...`, 'success');
    }

    function declineCall() {
      document.getElementById('incomingCallModal').style.display = 'none';
      if (!pendingCallData) return;

      ws.send(JSON.stringify({
        type: 'decline_call',
        callerId: pendingCallData.callerId
      }));
      pendingCallData = null;
    }

    async function createPeerConnection(targetUserId) {
      if (peerConnection) return;

      log(`Creating PeerConnection...`);
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      remoteStream = new MediaStream();
      const remoteVideo = document.getElementById('remoteVideo');
      remoteVideo.srcObject = remoteStream;

      peerConnection.ontrack = (event) => {
        log(`Received remote track: ${event.track.kind}`, 'success');
        remoteStream.addTrack(event.track);
        remoteVideo.play().catch(e => console.log('Autoplay play error:', e));
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ice_candidate',
            targetUserId: targetUserId,
            candidate: event.candidate
          }));
        }
      };

      peerConnection.oniceconnectionstatechange = () => {
        log(`ICE Connection State: ${peerConnection.iceConnectionState}`, peerConnection.iceConnectionState === 'connected' ? 'success' : 'info');
      };

      peerConnection.onconnectionstatechange = () => {
        log(`Peer Connection State: ${peerConnection.connectionState}`, peerConnection.connectionState === 'connected' ? 'success' : 'info');
      };
    }

    async function createAndSendOffer(targetUserId) {
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      ws.send(JSON.stringify({
        type: 'offer',
        targetUserId: targetUserId,
        sdp: offer
      }));
      log(`Sent SDP Offer to target user ${targetUserId}`, 'success');
    }

    function toggleAudio() {
      if (localStream && localStream.getAudioTracks().length > 0) {
        const track = localStream.getAudioTracks()[0];
        track.enabled = !track.enabled;
        document.getElementById('btnMuteAudio').textContent = track.enabled ? '🎙️ Mute Mic' : '🔇 Unmute Mic';
      }
    }

    function toggleVideo() {
      if (localStream && localStream.getVideoTracks().length > 0) {
        const track = localStream.getVideoTracks()[0];
        track.enabled = !track.enabled;
        document.getElementById('btnToggleVideo').textContent = track.enabled ? '📹 Disable Video' : '📷 Enable Video';
      }
    }

    function endCall() {
      if (currentTargetUserId && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'end_call',
          targetUserId: currentTargetUserId
        }));
      }
      resetCallUI();
      log('Call ended', 'warn');
    }

    function resetCallUI() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      iceCandidatesBuffer = [];
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('remoteLabel').textContent = 'Remote User (Waiting for call...)';
      document.getElementById('btnEndCall').disabled = true;
    }
  </script>
</body>
</html>
